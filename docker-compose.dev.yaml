services:
  workspace:
    profiles: [workspace]
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    working_dir: /workspace/check_annotator
    volumes:
      - .:/workspace/check_annotator
      - backend-mock-data:/data
    environment:
      APP_ENV: development
      APP_DATA_MODE: database
      DATABASE_URL: ${DATABASE_URL:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_CA: ${DB_SSL_CA:-}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  backend:
    image: check-annotator-backend:development
    networks:
      app-network: {}
      shared-gateway-net:
        aliases:
          - check_annotator-backend
    environment:
      APP_ENV: development
      APP_DATA_MODE: database
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    build:
      target: development
    working_dir: /workspace/check_annotator/backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    volumes:
      - .:/workspace/check_annotator
      - backend-mock-data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/database')
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    image: check-annotator-frontend:development
    networks:
      app-network: {}
      shared-gateway-net:
        aliases:
          - check_annotator-frontend
    environment:
      PORT: "80"
      # Poll bind-mounted files, including Next.js route discovery on Docker Desktop.
      WATCHPACK_POLLING: "true"
      INTERNAL_API_URL: http://check_annotator-backend:8000
    build:
      target: development
    working_dir: /workspace/frontend
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-node-modules:/workspace/frontend/node_modules
      - frontend-next:/workspace/frontend/.next
    expose:
      - "80"

volumes:
  frontend-node-modules:
  frontend-next:
  backend-mock-data:

networks:
  shared-gateway-net:
    external: true
