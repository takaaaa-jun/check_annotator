services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      # ホストの./frontendをDockerコンテナ内の/appにマウント
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Viteで使用しているChokidarライブラリを指定
      # CPUの使用率を要確認
      - CHOKIDAR_USEPOLLING=true
